{% extends "base.html" %}
{% block title_suffix %} — Database{% endblock %}

{% block content %}
<div class="page-header">
  <h1><i class="bi bi-server me-2 text-primary"></i>Database Settings</h1>
</div>

<div class="row">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header">SQL Server Connection</div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Server / Hostname</label>
            <input type="text" name="server" class="form-control" value="{{ db.server }}" required placeholder="e.g. HoloSQL or 192.168.1.100">
          </div>
          <div class="mb-3">
            <label class="form-label">Port</label>
            <input type="number" name="port" class="form-control" value="{{ db.port }}" required placeholder="1433">
          </div>
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="user" class="form-control" value="{{ db.user }}" required autocomplete="off">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
              <input type="password" name="password" id="dbPassword" class="form-control" value="{{ db.password }}" required autocomplete="new-password">
              <button class="btn btn-outline-secondary" type="button" onclick="togglePw('dbPassword', this)">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-floppy me-1"></i>Save
          </button>
          <a href="/" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
function togglePw(id, btn) {
  const input = document.getElementById(id);
  const isPassword = input.type === 'password';
  input.type = isPassword ? 'text' : 'password';
  btn.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
}
</script>
{% endblock %}
